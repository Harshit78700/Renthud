<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Room - RentHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page" data-page="book-room" data-role-guard="customer">
<div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Rent Room</h1>
                <p id="customerBookingNotice">Choose any available room below.</p>
            </div>
        </div>

        <div id="bookingSummary" class="info-strip booking-strip">
            <i class="fa-solid fa-circle-check"></i>
            <div class="booking-strip-copy" id="bookingSummaryText">No room booked yet.</div>
            <div id="bookingAction" class="booking-strip-action"></div>
        </div>

        <section id="bookRoomGrid" class="room-card-grid">
            <div class="empty">No rooms available</div>
        </section>
    </div>
</div>

<script src="app.js"></script>
<script src="my-rooms.js"></script>
</body>
</html>
