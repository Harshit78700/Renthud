<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentHub - Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page" data-page="login">
    <div class="login-wrapper">
        <div class="login-hero">
            <div class="hero-bg"><i class="fa-solid fa-building-user"></i></div>
            <div class="hero-content">
                <h1><i class="fa-solid fa-house"></i> RentHub</h1>
                <p>Separate admin and customer login with room booking, payments, and profiles in one place.</p>
            </div>
        </div>

        <div class="login-card-modern">
            <div class="card-header">
                <i class="fa-solid fa-right-to-bracket"></i>
                <h2>Sign In</h2>
                <p>Use your admin or customer account to continue.</p>
            </div>

            <form class="login-form-modern" onsubmit="return false;">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-envelope"></i> Email</label>
                    <input type="email" id="username" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>

                <button type="button" onclick="login()" class="login-btn-modern">
                    <span>Login</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="login-footer">
                <p id="error" class="error-modern"></p>
                <div id="demoCredentials" class="demo-creds"></div>
                <div class="auth-switch">
                    Need a new account? <a class="switch-link" href="register.html">Register here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
