<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - RentHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page" data-page="reports" data-role-guard="admin">
<div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Reports</h1>
                <p>Booking, occupancy, and rent collection summary.</p>
            </div>
            <div class="button-group">
                <button type="button" onclick="exportReportsCSV()"><i class="fa-solid fa-file-csv"></i> Export CSV</button>
                <button type="button" onclick="exportReportsPDF()"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
            </div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="icon green"><i class="fa-solid fa-indian-rupee-sign"></i></div>
                <h2 id="repRevenue">Rs 0.00</h2>
                <p>Total Revenue Collected</p>
            </div>
            <div class="card">
                <div class="icon blue"><i class="fa-solid fa-house-user"></i></div>
                <h2 id="repOccupancyRate">0%</h2>
                <p>Occupancy Rate</p>
            </div>
            <div class="card">
                <div class="icon purple"><i class="fa-solid fa-receipt"></i></div>
                <h2 id="repCollectedCount">0</h2>
                <p>Payments Collected</p>
            </div>
            <div class="card">
                <div class="icon orange"><i class="fa-solid fa-money-bill-wave"></i></div>
                <h2 id="repPaytmCount">0</h2>
                <p>Digital Payments</p>
            </div>
        </div>

        <div class="overview-grid report-grid">
            <div class="overview">
                <h2>Payment Status Breakdown</h2>
                <p>Paid <span id="repPaidText">0 of 0</span></p>
                <progress id="repPaidProgress" value="0" max="100"></progress>

                <p>Pending <span id="repPendingText">0 of 0</span></p>
                <progress id="repPendingProgress" value="0" max="100"></progress>

                <p>Overdue <span id="repOverdueText">0 of 0</span></p>
                <progress id="repOverdueProgress" value="0" max="100"></progress>
            </div>

            <div class="overview">
                <h2>Room Occupancy</h2>
                <p>Booked <span id="repOccupiedText">0 of 0</span></p>
                <progress id="repOccupiedProgress" value="0" max="100"></progress>

                <p>Available <span id="repAvailableText">0 of 0</span></p>
                <progress id="repAvailableProgress" value="0" max="100"></progress>

                <p>Maintenance <span id="repMaintenanceText">0 of 0</span></p>
                <progress id="repMaintenanceProgress" value="0" max="100"></progress>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="reports.js"></script>
</body>
</html>
