<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - RentHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page" data-page="tenants" data-role-guard="admin">
<div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Customers</h1>
                <p id="totalTenants">0 registered customers</p>
            </div>
        </div>

        <div class="table customers-table">
            <div class="table-header">
                <div>Name</div>
                <div>Email</div>
                <div>Phone</div>
                <div>Booked Room</div>
                <div>Actions</div>
            </div>

            <div id="tenantTable">
                <div class="empty">No customers found</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="tenants.js"></script>
</body>
</html>
