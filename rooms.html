<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rooms - RentHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page" data-page="rooms" data-role-guard="admin">
<div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Rooms</h1>
                <p id="totalRooms">0 rooms total</p>
            </div>
            <button type="button" onclick="addRoom()"><i class="fa-solid fa-plus"></i> Add Room</button>
        </div>

        <div class="table rooms-table admin-rooms-table">
            <div class="table-header">
                <div>Room</div>
                <div>Description</div>
                <div>Rent</div>
                <div>Status</div>
                <div>Booked By</div>
                <div>Actions</div>
            </div>

            <div id="roomTable">
                <div class="empty">No rooms found</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="rooms.js"></script>
</body>
</html>
