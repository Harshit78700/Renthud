<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - RentHub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page" data-page="payments" data-role-guard="admin">
<div class="dashboard">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main">
        <div class="topbar">
            <div>
                <h1>Payments</h1>
                <p id="totalPayments">0 payment records</p>
            </div>
            <button type="button" onclick="addAdminPayment()"><i class="fa-solid fa-plus"></i> Add Payment</button>
        </div>

        <div class="payment-cards">
            <div class="box green">
                <h2 id="collected">Rs 0</h2>
                <p>Collected</p>
            </div>
            <div class="box yellow">
                <h2 id="pending">Rs 0</h2>
                <p>Pending</p>
            </div>
            <div class="box red">
                <h2 id="overdue">Rs 0</h2>
                <p>Overdue</p>
            </div>
        </div>

        <div class="table payments-table admin-payments-table">
            <div class="table-header">
                <div>Customer</div>
                <div>Room</div>
                <div>Month</div>
                <div>Amount</div>
                <div>Status</div>
                <div>Method</div>
                <div>Actions</div>
            </div>

            <div id="paymentTable">
                <div class="empty">No payments found</div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script src="payments.js"></script>
</body>
</html>
